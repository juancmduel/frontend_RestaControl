<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>RestaControl | Carta del Restaurante</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link href="../css/styles.css" rel="stylesheet">
</head>

<body class="admin-body">

<div id="sidebarMount"></div>

<div class="main-wrapper">

    <header class="topbar no-print">

        <button
            type="button"
            class="btn btn-icon"
            id="sidebarToggle">

            <i class="bi bi-list" style="font-size:1.3rem;"></i>
        </button>

        <nav
            aria-label="breadcrumb"
            class="ms-2 d-none d-sm-block">

            <ol class="breadcrumb mb-0">

                <li class="breadcrumb-item">
                    <a href="dashboard.html">
                        Inicio
                    </a>
                </li>

                <li class="breadcrumb-item active">
                    Carta del Restaurante
                </li>

            </ol>

        </nav>

        <div class="topbar-right ms-auto d-flex align-items-center gap-3">

            <span
                class="topbar-date"
                id="topbarDate">
            </span>

            <div class="dropdown">

                <button
                    type="button"
                    class="btn btn-icon"
                    data-bs-toggle="dropdown">

                    <i
                        class="bi bi-person-circle"
                        style="font-size:1.4rem;color:#7a8898;">
                    </i>

                </button>

                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">

                    <li>
                        <div class="d-flex align-items-center gap-2 px-3 py-2">

                            <div
                                class="user-avatar"
                                style="width:36px;height:36px;flex-shrink:0;">

                                <i class="bi bi-person-fill"></i>
                            </div>

                            <div>
                                <div
                                    class="fw-semibold small"
                                    id="headerUserName">

                                    Administrador
                                </div>

                                <div
                                    class="text-muted"
                                    style="font-size:.75rem;"
                                    id="headerUserRole">

                                    Sistema Activo
                                </div>
                            </div>

                        </div>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <a
                            class="dropdown-item text-danger"
                            href="#"
                            onclick="event.preventDefault(); Auth.logout();">

                            <i class="bi bi-box-arrow-right me-2"></i>
                            Cerrar sesión
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </header>

    <main class="page-content carta-menu-page">

        <div class="page-header no-print">

            <div>
                <h1 class="page-title">
                    <i class="bi bi-menu-button-wide"></i>
                    Carta del Restaurante
                </h1>

                <p class="page-desc">
                    Vista de los platos y productos disponibles para los clientes.
                </p>
            </div>

            <div class="d-flex gap-2">

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    id="btnActualizarCartaMenu">

                    <i class="bi bi-arrow-clockwise me-1"></i>
                    Actualizar
                </button>

                <button
                    type="button"
                    class="btn btn-brand"
                    id="btnImprimirCarta">

                    <i class="bi bi-printer me-1"></i>
                    Imprimir carta
                </button>

            </div>

        </div>

        <section
            class="restaurant-menu"
            id="restaurantMenu">

            <div class="restaurant-menu-loading">

                <span class="spinner-border spinner-border-sm me-2"></span>
                Cargando carta...

            </div>

        </section>

    </main>

    <footer
        class="admin-footer no-print"
        id="footer-global">
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/carta-menu.js?v=1"></script>

<script>
(async () => {
    await Layout.loadSharedSidebar();
    Layout.init('cartaMenu');

    if (window.CartaMenu) {
        await window.CartaMenu.init();
    }
})();
</script>

</body>
</html>
